<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14251c" />
    <meta
      name="description"
      content="Your device-local workout journal. Routines, sets and encrypted sharing."
    />
    <title>GYM LOG · Workout journal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GYM LOG" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <main
        id="startup-screen"
        style="
          margin: 0 auto;
          padding: 48px 24px;
          max-width: 640px;
          width: 100%;
          font-family: system-ui, sans-serif;
          color: #14251c;
        "
      >
        <h1>GYM LOG</h1>
        <p id="startup-status" role="status">Loading your workout journal…</p>
        <button id="startup-retry" type="button" hidden>
          Check for updates and retry
        </button>
        <details id="startup-details" hidden>
          <summary id="startup-details-label">Error details</summary>
          <pre
            id="startup-error"
            style="white-space: pre-wrap; overflow-wrap: anywhere"
          ></pre>
        </details>
        <p>
          <a id="startup-recovery" href="./recover.html" hidden
            >Recover app files</a
          >
        </p>
        <noscript>Enable JavaScript to use GYM LOG.</noscript>
      </main>
    </div>
    <div id="toast" role="status"></div>
    <script src="/app-shell.js"></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
